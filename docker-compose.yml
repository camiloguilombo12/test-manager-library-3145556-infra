name: manager-library

services:
  # Motor vacío: el esquema y las tablas los crean las migraciones de la API (ADR-001)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # El servidor trabaja en UTC (data-model.md)
      TZ: UTC
      PGTZ: UTC
    ports:
      # Solo accesible desde el propio equipo
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - library-net

  # API Laravel: al arrancar aplica las migraciones sobre el motor vacío
  api:
    build: ../test-manager-library-3145556-api
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CLOCK_OFFSET_DAYS: ${CLOCK_OFFSET_DAYS:-0}
      COVERS_DIR: /var/www/html/var/covers
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - covers:/var/www/html/var/covers
    networks:
      - library-net

volumes:
  db-data:
  covers:

networks:
  library-net:
